name: Verificación de despliegues de Vercel

on:
  repository_dispatch:
    types: [vercel.deployment.ready]

permissions:
  contents: read

concurrency:
  group: verificacion-produccion
  cancel-in-progress: false

jobs:
  identificar_despliegue:
    name: Identificar versión y procedencia del despliegue
    if: >-
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.name == 'g6-productos-ofertas' &&
      github.event.client_payload.project.id == vars.VERCEL_PROJECT_ID &&
      github.event.client_payload.git.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: vercel-produccion
    permissions:
      contents: read
    outputs:
      url_inmutable: ${{ steps.identidad.outputs.deployment_url }}
      sha: ${{ steps.identidad.outputs.commit_sha }}
    steps:
      - name: Obtener código confiable de la rama principal
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/heads/master
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Validar identidad del despliegue en Vercel y GitHub
        id: identidad
        env:
          VERCEL_DEPLOYMENT_ID: ${{ github.event.client_payload.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verificar-despliegue-vercel.mjs

  verificar_despliegue:
    name: Comprobar funcionamiento del despliegue
    needs: [identificar_despliegue]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vercel-produccion
    permissions:
      contents: read
    steps:
      - name: Obtener código confiable de la rama principal
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/heads/master
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium para la comprobación remota
        run: npx playwright install --with-deps chromium
      - name: Comprobar URL inmutable de producción
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/vercel-smoke.mjs "${{ needs.identificar_despliegue.outputs.url_inmutable }}"
      - name: Registrar evidencia de la comprobación remota
        if: always()
        env:
          DEPLOYMENT_SHA: ${{ needs.identificar_despliegue.outputs.sha }}
          DEPLOYMENT_URL: ${{ needs.identificar_despliegue.outputs.url_inmutable }}
          RESULTADO: ${{ job.status }}
        run: |
          {
            echo '### Comprobación del despliegue de Vercel'
            echo
            echo "- Resultado: **$RESULTADO**"
            echo "- SHA: `$DEPLOYMENT_SHA`"
            echo "- URL inmutable verificada: $DEPLOYMENT_URL"
            echo '- Alcance: rutas SPA, recarga, contenido, recursos, MIME, consola y solicitudes de red.'
            echo '- Datos: Production conserva el modo de demostración configurado; no acredita integración con API real.'
          } >> "$GITHUB_STEP_SUMMARY"

  publicar_resultado:
    name: Registrar resultado de verificación
    needs: [identificar_despliegue, verificar_despliegue]
    if: always() && needs.identificar_despliegue.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Obtener código confiable de la rama principal
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/heads/master
          persist-credentials: false
      - name: Confirmar que master no avanzó durante la prueba
        id: version_actual
        if: always()
        env:
          DEPLOYMENT_SHA: ${{ needs.identificar_despliegue.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verificar-head-master.mjs
      - name: Publicar estado oficial para los controles de despliegue de Vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: verificacion-despliegue-produccion
          github_token: ${{ github.token }}
      - name: Exigir comprobación remota y versión actual satisfactorias
        if: always()
        env:
          RESULTADO_COMPROBACION: ${{ needs.verificar_despliegue.result }}
          RESULTADO_VERSION: ${{ steps.version_actual.conclusion }}
        run: |
          echo "Resultado de la comprobación remota: $RESULTADO_COMPROBACION"
          echo "Resultado de la versión de master: $RESULTADO_VERSION"
          if [ "$RESULTADO_COMPROBACION" != 'success' ] || [ "$RESULTADO_VERSION" != 'success' ]; then
            echo '::error::No se publicará éxito porque la comprobación falló o el despliegue quedó obsoleto.'
            exit 1
          fi
